name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  npm-security:
    runs-on: ubuntu-latest
    name: Check npm dependency security
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:dependencies
      - run: npm audit

  tooling-smoke:
    runs-on: ubuntu-latest
    name: Check artifact and Docker actions
    permissions:
      contents: read
      packages: read
    steps:
      - name: Create smoke-test input
        run: |
          mkdir -p smoke/input
          printf 'artifact round trip\n' > smoke/input/check.txt
          printf 'FROM scratch\nCOPY check.txt /check.txt\n' > smoke/input/Dockerfile
      - uses: actions/upload-artifact@v7
        with:
          name: tooling-smoke
          path: smoke/input/
          retention-days: 1
      - uses: actions/download-artifact@v8
        with:
          name: tooling-smoke
          path: smoke/downloaded/
      - name: Verify artifact round trip
        run: diff -r smoke/input smoke/downloaded
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: smoke/downloaded
          platforms: linux/amd64
          push: false

  configure-contract:
    runs-on: ubuntu-latest
    name: Check Toolboxes configuration contract
    steps:
      - uses: actions/checkout@v7
      - name: Test standalone and in-tree SDK configurations
        run: python3 -m unittest discover -s tests -p test_cmake_toolboxes.py -v

  build:
    runs-on: self-feelpp

    name: Build deb packages
    if: ${{ !contains(github.event.head_commit.message, 'build skip') }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: Test
        if: "!contains(github.event.head_commit.message, 'skip tests')"
        run: ctest --preset default

      - name: Package
        run: cmake --build --preset default -t package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: deb-artifacts
          path: build/default/assets/feelpp-app-*.deb

  docker:
    runs-on: self-feelpp
    needs: build
    name: Build and push docker image
    if: ${{ github.ref_name == 'master' || startsWith(github.ref ,'refs/tags/v') || contains(github.event.head_commit.message, '[build container]') }}
    outputs:
      tag: ${{ steps.tag_extractor.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: deb-artifacts
          path: artifacts/

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/numpex/apps-feelpp
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.url="https://github.com/numpex/apps-feelpp"
            org.opencontainers.image.source="https://github.com/numpex/apps-feelpp"
            org.opencontainers.image.authors="Cemosis <contact@cemosis.fr>"

      - name: Extract tag
        id: tag_extractor
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | tr ' ' '\n' | head -n 1)
          echo "tag=$FIRST_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          context: artifacts
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./Dockerfile

  apptainer :
    runs-on: self-feelpp
    name: Build and Push apptainer image
    needs: docker
    env:
      apptainer: /opt/apptainer/latest/bin/apptainer
    steps:
      - name: Login to GHCR
        run: |
          ${{ env.apptainer }} remote login  -u ${{ github.repository_owner }} -p ${{ secrets.CR_PAT }} oras://ghcr.io

      - name: Get docker image ${{ needs.docker.outputs.tag }}
        run: |
          echo "Using tag: ${{ needs.docker.outputs.tag }}"
          ${{ env.apptainer }} pull -F apps-feelpp.sif docker://${{ needs.docker.outputs.tag }}
          ls -lrt

      - name: Push apptainer image ${{ needs.docker.outputs.tag }} to ghcr.io
        run: |
          echo "Using tag: ${{ needs.docker.outputs.tag }}"
          ${{ env.apptainer }} push apps-feelpp.sif oras://${{ needs.docker.outputs.tag }}-sif
